passing_score: 70
questions:
- type: mcq
  question: 'What happens if you provide a cleartext password (e.g. password: "secret")
    directly to the user module?'
  options:
  - Linux writes the plaintext string into /etc/shadow, breaking logins because the
    login PAM subsystem expects a salted hash
  - Ansible automatically prompts for an encryption key
  - The task fails with a YAML syntax error
  - The Linux kernel automatically converts it to SHA-512
  correct: Linux writes the plaintext string into /etc/shadow, breaking logins because
    the login PAM subsystem expects a salted hash
  explanation: Linux PAM compares hashes; storing plaintext prevents valid cryptographic
    comparisons.
- type: mcq
  question: Which Jinja2 filter is used to generate a secure salted Linux password
    hash in Ansible?
  options:
  - password_hash('sha512')
  - hash('md5')
  - encrypt_password('aes256')
  - sha512_digest()
  correct: password_hash('sha512')
  explanation: '`{{ ''mypass'' | password_hash(''sha512'') }}` generates a standard
    Linux /etc/shadow compatible hash.'
- type: mcq
  question: 'What does ''update_password: on_create'' do?'
  options:
  - Sets the password only when the user account is first created, without overwriting
    it on future runs
  - Forces the user to change their password at next login
  - Updates the password every 30 days
  - Generates a random password upon reboot
  correct: Sets the password only when the user account is first created, without
    overwriting it on future runs
  explanation: '`on_create` prevents Ansible from resetting passwords if users change
    them locally via `passwd`.'
- type: true_false
  question: By default, 'update_password' is set to 'always', meaning Ansible will
    overwrite the password on every playbook execution if the hash differs.
  correct: true
  explanation: '`update_password` defaults to `always`.'
- type: mcq
  question: What prefix identifier indicates a SHA-512 hashed password in Linux /etc/shadow?
  options:
  - $6$
  - $1$
  - $2a$
  - $5$
  correct: $6$
  explanation: '`$6$` designates SHA-512; `$1$` is MD5; `$5$` is SHA-256; `$2a$` is
    Blowfish/Bcrypt.'
- type: mcq
  question: Why should salt be included when generating password hashes?
  options:
  - It prevents precomputed dictionary attacks (rainbow tables) from cracking identical
    passwords
  - It makes the password readable by standard users
  - It compresses the password to save disk space
  - Salt is required by SSH
  correct: It prevents precomputed dictionary attacks (rainbow tables) from cracking
    identical passwords
  explanation: Cryptographic salts ensure identical passwords produce distinct hash
    outputs.
- type: true_false
  question: If no salt is specified in the password_hash filter, Ansible will randomly
    generate a salt automatically.
  correct: true
  explanation: Ansible generates a random cryptographic salt if none is explicitly
    passed.
- type: mcq
  question: What tool or feature in Ansible is used to encrypt sensitive passwords
    and secrets in playbooks?
  options:
  - Ansible Vault
  - Ansible Shield
  - Ansible Lock
  - Ansible SecretManager
  correct: Ansible Vault
  explanation: Ansible Vault encrypts files or inline variables using AES-256.
- type: true_false
  question: 'If ''password: "*"'' is specified, the user account is created with login
    disabled via password.'
  correct: true
  explanation: A password of `*` or `!` in `/etc/shadow` disables password login.
- type: mcq
  question: Which Python library on the control node powers the 'password_hash' filter?
  options:
  - passlib (or crypt)
  - hashlib only
  - requests
  - bcrypt-cli
  correct: passlib (or crypt)
  explanation: Ansible uses the `passlib` Python library or Python's built-in `crypt`
    module.
- type: true_false
  question: 'When ''update_password: always'' is set and random salt is used without
    a fixed salt, every playbook run will report ''changed: true''.'
  correct: true
  explanation: Because a newly generated salt yields a different hash string every
    run, Ansible thinks the password changed!
- type: mcq
  question: 'What is the recommended approach to avoid false ''changed: true'' reports
    when using hashed passwords?'
  options:
  - 'Use ''update_password: on_create'' or supply a fixed salt in the filter'
  - Always use cleartext passwords
  - Disable check mode
  - Remove the shadow file
  correct: 'Use ''update_password: on_create'' or supply a fixed salt in the filter'
  explanation: 'Fixed salts or `update_password: on_create` maintain idempotency.'
- type: true_false
  question: A user created with an encrypted password in /etc/shadow can still log
    in using SSH keys if authorized_keys is configured.
  correct: true
  explanation: SSH key authentication works independently of password authentication.
- type: mcq
  question: What command-line tool allows encrypting a single string variable for
    use in playbooks?
  options:
  - ansible-vault encrypt_string
  - ansible-vault hide
  - ansible-encrypt
  - ansible-vault mask
  correct: ansible-vault encrypt_string
  explanation: '`ansible-vault encrypt_string` outputs a copy-pasteable encrypted
    YAML block.'
- type: true_false
  question: Linux passwords hashed with MD5 ($1$) are considered cryptographically
    secure for modern production systems.
  correct: false
  explanation: MD5 is obsolete and vulnerable to collision attacks; SHA-512 ($6$)
    or Yescrypt is standard.
- type: mcq
  question: What parameter in the user module forces an account password to expire
    immediately so the user must set a new one on login?
  options:
  - 'password_expire_max: 0 (or chage command)'
  - 'expire_password: true'
  - 'force_change: yes'
  - 'reset_password: now'
  correct: 'password_expire_max: 0 (or chage command)'
  explanation: Setting password expiration parameters forces an immediate password
    reset on next terminal login.
- type: true_false
  question: Ansible Vault encrypted files can be safely committed to private Git repositories.
  correct: true
  explanation: Because Vault uses strong AES-256 encryption, the ciphertext cannot
    be read without the vault password.
- type: mcq
  question: Which Linux file contains the encrypted password hashes that only root
    can read?
  options:
  - /etc/shadow
  - /etc/passwd
  - /etc/security
  - /etc/pam.d
  correct: /etc/shadow
  explanation: '`/etc/shadow` has permissions 0640 or 0600 readable only by root and
    the shadow group.'
